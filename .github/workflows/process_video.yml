name: Video Auto Subtitles
on:
  push:
    paths:
      - 'video.mp4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # تفعيل صلاحيات ImageMagick لكتابة النصوص
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Dependencies
        run: |
          pip install openai-whisper moviepy==1.0.3 arabic-reshaper python-bidi

      - name: Run Animation Script
        run: python main.py

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-video
          path: output.mp4
